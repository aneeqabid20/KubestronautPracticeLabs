apiVersion: v1
kind: Namespace
metadata:
  name: kpl-storage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kpl-local-path-provisioner
  namespace: kpl-storage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kpl-local-path-provisioner
  namespace: kpl-storage-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kpl-local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kpl-local-path-provisioner
  namespace: kpl-storage-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kpl-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: kpl-local-path-provisioner
    namespace: kpl-storage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kpl-local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kpl-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: kpl-local-path-provisioner
    namespace: kpl-storage-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpl-local-path-provisioner
  namespace: kpl-storage-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kpl-local-path-provisioner
  template:
    metadata:
      labels:
        app: kpl-local-path-provisioner
    spec:
      serviceAccountName: kpl-local-path-provisioner
      containers:
        - name: local-path-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.36
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: kpl-local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kpl-local-path
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kpl-local-path-config
  namespace: kpl-storage-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/opt/kpl-local-path-provisioner"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
