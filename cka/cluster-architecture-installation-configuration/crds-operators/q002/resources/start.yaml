apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kpl.example
spec:
  group: kpl.example
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-operator
  namespace: cka-ca-q015
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kpl-widget-operator
rules:
  - apiGroups: ["kpl.example"]
    resources: ["gadgets"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kpl-widget-operator
subjects:
  - kind: ServiceAccount
    name: widget-operator
    namespace: cka-ca-q015
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kpl-widget-operator
