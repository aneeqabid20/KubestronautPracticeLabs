apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-app
  namespace: cka-ca-q007
spec:
  replicas: 3
  selector:
    matchLabels: {app: maintenance-app}
  template:
    metadata:
      labels: {app: maintenance-app}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: maintenance-scratch
  namespace: cka-ca-q007
spec:
  nodeSelector:
    kubernetes.io/hostname: k8slab-node02
  containers:
    - name: scratch
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      emptyDir: {}
