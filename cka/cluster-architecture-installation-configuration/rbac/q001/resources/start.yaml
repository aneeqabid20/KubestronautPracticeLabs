apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: cka-ca-q001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: cka-ca-q001
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-read
  namespace: cka-ca-q001
subjects:
  - kind: ServiceAccount
    name: wrong-auditor
    namespace: cka-ca-q001
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
