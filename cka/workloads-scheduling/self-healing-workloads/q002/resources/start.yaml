apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
  namespace: cka-ws-q008
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-app}
  template:
    metadata:
      labels: {app: slow-app}
    spec:
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["sh","-c","sleep 20; touch /tmp/started; sleep 3600"]
          livenessProbe:
            exec:
              command: ["test","-f","/tmp/started"]
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
