apiVersion: v1
kind: Pod
metadata:
  name: affinity-app
  namespace: cka-ws-q009
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [does-not-exist]
