apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: kpl-nginx-tls}
spec: {controller: example.com/kpl-ingress}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: cka-net-q011}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: secure-web, namespace: cka-net-q011}
spec:
  ingressClassName: kpl-nginx-tls
  rules:
    - host: secure.kpl.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
