apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: cka-net-q013}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers: [{name: nginx, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: cka-net-q013}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: cka-net-q013}
spec:
  dnsPolicy: Default
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
