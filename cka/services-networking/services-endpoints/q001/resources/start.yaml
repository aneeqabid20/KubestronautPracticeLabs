apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: cka-net-q005}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: nginx, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: cka-net-q005}
spec:
  type: ClusterIP
  selector: {app: wrong}
  ports: [{port: 80, targetPort: 80}]
