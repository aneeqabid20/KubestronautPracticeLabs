apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: cka-net-q007}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: nginx, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: cka-net-q007}
spec:
  containers: [{name: c, image: busybox:1.36.1, command: ["sh","-c","sleep 3600"]}]
