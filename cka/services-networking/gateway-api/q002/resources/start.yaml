apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: kpl-example}
spec: {controllerName: example.com/kpl-gateway}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web-gw, namespace: cka-net-q009}
spec:
  gatewayClassName: kpl-example
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: v1
kind: Service
metadata: {name: v1, namespace: cka-net-q009}
spec:
  selector: {version: v1}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: v2, namespace: cka-net-q009}
spec:
  selector: {version: v2}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: split, namespace: cka-net-q009}
spec:
  parentRefs: [{name: web-gw}]
  rules:
    - backendRefs:
        - {name: v1, port: 80, weight: 50}
        - {name: v2, port: 80, weight: 50}
