apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kpl-example
spec:
  controllerName: example.com/kpl-gateway
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: cka-net-q008}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web-gw, namespace: cka-net-q008}
spec:
  gatewayClassName: kpl-example
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web-route, namespace: cka-net-q008}
spec:
  parentRefs:
    - name: web-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: web
          port: 8080
