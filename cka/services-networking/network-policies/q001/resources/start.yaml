apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka-net-q003
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers: [{name: nginx, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: cka-net-q003}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: allowed, namespace: cka-net-q003, labels: {role: client}}
spec:
  containers: [{name: c, image: busybox:1.36.1, command: ["sh","-c","sleep 3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: denied, namespace: cka-net-q003, labels: {role: other}}
spec:
  containers: [{name: c, image: busybox:1.36.1, command: ["sh","-c","sleep 3600"]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: cka-net-q003}
spec:
  podSelector: {}
  policyTypes: [Ingress]
