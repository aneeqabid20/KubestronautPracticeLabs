apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: cka-net-q001
spec:
  nodeSelector:
    kubernetes.io/hostname: k8slab-node01
  containers:
    - name: server
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo server-ok >/www/index.html
          httpd -f -h /www -p 127.0.0.1:8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: cka-net-q001
spec:
  nodeSelector:
    kubernetes.io/hostname: k8slab-node02
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
