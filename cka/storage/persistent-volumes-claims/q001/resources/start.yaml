apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-pv
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: wrong-static
  hostPath:
    path: /opt/kpl/db
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage-q005
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: cka-storage-q005
spec:
  storageClassName: db-static
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
