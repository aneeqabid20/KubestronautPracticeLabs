apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage-q002
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-local
provisioner: example.invalid/broken
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  namespace: cka-storage-q002
spec:
  storageClassName: fast-local
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: cache-user
  namespace: cka-storage-q002
spec:
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: cache
