apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: cka-storage-q001
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: cka-storage-q001
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: web-data
