apiVersion: v1
kind: PersistentVolume
metadata:
  name: archive-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Delete
  storageClassName: archive-static
  hostPath:
    path: /opt/kpl/archive
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage-q004
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive
  namespace: cka-storage-q004
spec:
  storageClassName: archive-static
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
