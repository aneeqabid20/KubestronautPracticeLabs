apiVersion: v1
kind: PersistentVolume
metadata:
  name: reports-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: reports-static
  hostPath:
    path: /opt/kpl/reports
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage-q003
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports
  namespace: cka-storage-q003
spec:
  storageClassName: reports-static
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
