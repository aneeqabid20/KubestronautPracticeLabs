apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka-tr-q008
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cka-tr-q008
spec:
  selector: {app: backend}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer
  namespace: cka-tr-q008
spec:
  replicas: 1
  selector:
    matchLabels: {app: observer}
  template:
    metadata:
      labels: {app: observer}
    spec:
      containers:
        - name: main
          image: busybox:1.36.1
          command: ["sh","-c","sleep 3600"]
        - name: sidecar
          image: busybox:1.36.1
          env:
            - name: BACKEND_PORT
              value: "9999"
          command:
            - sh
            - -c
            - |
              while true; do
                if wget -q -T 2 -O- "http://backend:${BACKEND_PORT}" >/dev/null 2>&1; then
                  echo "backend reachable"
                else
                  echo "backend unreachable on port ${BACKEND_PORT}" >&2
                fi
                sleep 2
              done
