apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: cka-tr-q006
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka-tr-q006
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
