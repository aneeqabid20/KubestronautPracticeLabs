apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka-tr-q011
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cka-tr-q011
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: cka-tr-q011
  labels: {access: api}
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked
  namespace: cka-tr-q011
spec:
  containers:
    - name: blocked
      image: busybox:1.36.1
      command: ["sh","-c","sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cka-tr-q011
spec:
  podSelector: {}
  policyTypes: [Ingress]
